[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "actionproof-backend"
version = "0.3.0"
description = "ActionProof runtime API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "moss==1.9.1",
  "pydantic>=2.9,<3",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.30,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "moss_live: requires live Moss credentials and seeded indexes"
]
