services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ACTIONPROOF_ENV: ${ACTIONPROOF_ENV:-production}
      MOSS_PROJECT_ID: ${MOSS_PROJECT_ID}
      MOSS_PROJECT_KEY: ${MOSS_PROJECT_KEY}
      MOSS_RUNTIME_MODE: ${MOSS_RUNTIME_MODE:-local}
      MOSS_POLICY_INDEX: ${MOSS_POLICY_INDEX:-actionproof-policy}
      MOSS_KNOWLEDGE_INDEX: ${MOSS_KNOWLEDGE_INDEX:-actionproof-knowledge}
      MOSS_LIVE_STATE_INDEX: ${MOSS_LIVE_STATE_INDEX:-actionproof-live-state}
      MOSS_MODEL_ID: ${MOSS_MODEL_ID:-moss-minilm}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 6

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
